services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: experil
      POSTGRES_PASSWORD: experil123
      POSTGRES_DB: experilearn
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://experil:experil123@postgres:5432/experilearn
      SECRET: change-me-in-prod
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    environment:
      VITE_API: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
