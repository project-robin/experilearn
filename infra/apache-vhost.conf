<VirtualHost *:80>
    ServerName experilearn.example.com

    ProxyPass /api http://127.0.0.1:8000
    ProxyPassReverse /api http://127.0.0.1:8000

    ProxyPass / http://127.0.0.1:5173
    ProxyPassReverse / http://127.0.0.1:5173

    ErrorLog ${APACHE_LOG_DIR}/experilearn-error.log
    CustomLog ${APACHE_LOG_DIR}/experilearn-access.log combined
</VirtualHost>
